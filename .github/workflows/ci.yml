name: verify
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements-dev.lock
      - run: python -m pip install --no-deps -e .
      - run: ruff check src tests scripts
      - run: ruff format --check src tests scripts
      - run: mypy src
      - run: pytest -q
      - run: cfn-lint infra/template.yaml
      - run: pip-audit -r requirements.lock
      - run: pip-audit -r requirements-dev.lock
      - name: Validate and build SAM without deployment
        env:
          SAM_CLI_TELEMETRY: '0'
          AWS_EC2_METADATA_DISABLED: 'true'
        run: |
          python -m venv .sam-tools
          .sam-tools/bin/python -m pip install aws-sam-cli==1.170.0
          .sam-tools/bin/sam validate --template-file infra/template.yaml --lint --region us-east-1
          .sam-tools/bin/sam build --template-file infra/template.yaml
