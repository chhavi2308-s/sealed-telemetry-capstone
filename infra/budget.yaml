{
  "AWSTemplateFormatVersion": "2010-09-09",
  "Description": "Optional owner-approved account monthly cost notification; does not cap spend",
  "Parameters": {
    "BudgetName": {
      "Type": "String"
    },
    "MonthlyUsd": {
      "Type": "Number",
      "MinValue": 1
    },
    "NotificationEmail": {
      "Type": "String",
      "AllowedPattern": "[^@ ]+@[^@ ]+\\.[^@ ]+"
    }
  },
  "Resources": {
    "MonthlyBudget": {
      "Type": "AWS::Budgets::Budget",
      "Properties": {
        "Budget": {
          "BudgetName": {
            "Ref": "BudgetName"
          },
          "BudgetType": "COST",
          "TimeUnit": "MONTHLY",
          "BudgetLimit": {
            "Amount": {
              "Ref": "MonthlyUsd"
            },
            "Unit": "USD"
          }
        },
        "NotificationsWithSubscribers": [
          {
            "Notification": {
              "NotificationType": "ACTUAL",
              "ComparisonOperator": "GREATER_THAN",
              "Threshold": 50,
              "ThresholdType": "PERCENTAGE"
            },
            "Subscribers": [
              {
                "SubscriptionType": "EMAIL",
                "Address": {
                  "Ref": "NotificationEmail"
                }
              }
            ]
          },
          {
            "Notification": {
              "NotificationType": "ACTUAL",
              "ComparisonOperator": "GREATER_THAN",
              "Threshold": 80,
              "ThresholdType": "PERCENTAGE"
            },
            "Subscribers": [
              {
                "SubscriptionType": "EMAIL",
                "Address": {
                  "Ref": "NotificationEmail"
                }
              }
            ]
          },
          {
            "Notification": {
              "NotificationType": "ACTUAL",
              "ComparisonOperator": "GREATER_THAN",
              "Threshold": 100,
              "ThresholdType": "PERCENTAGE"
            },
            "Subscribers": [
              {
                "SubscriptionType": "EMAIL",
                "Address": {
                  "Ref": "NotificationEmail"
                }
              }
            ]
          }
        ]
      }
    }
  }
}
