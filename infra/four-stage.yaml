      "Type": "AWS::DynamoDB::Table",
      "DeletionPolicy": "Retain",
      "UpdateReplacePolicy": "Retain",
      "Properties": {
        "BillingMode": "PAY_PER_REQUEST",
        "AttributeDefinitions": [
          {
            "AttributeName": "action_id",
            "AttributeType": "S"
          }
        ],
        "KeySchema": [
          {
            "AttributeName": "action_id",
            "KeyType": "HASH"
          }
        ],
        "SSESpecification": {
          "SSEEnabled": false
        },
        "TimeToLiveSpecification": {
          "AttributeName": "expires_at",
          "Enabled": true
        },
        "Tags": [
          {
            "Key": "Project",
            "Value": "SealedTelemetryFourStage"
          },
          {
            "Key": "Owner",
            "Value": {
              "Ref": "Owner"
            }
          },
          {
            "Key": "ExpiresOn",
            "Value": {
              "Ref": "ExpiresOn"
            }
          }
        ]
      }
    },
