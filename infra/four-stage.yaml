          {
            "AttributeName": "token_hash",
            "AttributeType": "S"
          }
        ],
        "KeySchema": [
          {
            "AttributeName": "token_hash",
            "KeyType": "HASH"
          }
        ],
        "SSESpecification": {
          "SSEEnabled": false
        },
        "TimeToLiveSpecification": {
          "AttributeName": "expires_at",
          "Enabled": true
        },
        "Tags": [
          {
            "Key": "Project",
            "Value": "SealedTelemetryFourStage"
          },
          {
            "Key": "Owner",
            "Value": {
              "Ref": "Owner"
            }
          },
          {
            "Key": "ExpiresOn",
            "Value": {
              "Ref": "ExpiresOn"
            }
          }
        ]
      }
    },
    "SaasAudit": {
      "Type": "AWS::DynamoDB::Table",
      "DeletionPolicy": "Retain",
      "UpdateReplacePolicy": "Retain",
      "Properties": {
        "BillingMode": "PAY_PER_REQUEST",
