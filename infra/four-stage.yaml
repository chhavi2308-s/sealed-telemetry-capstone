{
  "AWSTemplateFormatVersion": "2010-09-09",
  "Transform": "AWS::Serverless-2016-10-31",
  "Description": "Only four-stage synthetic invoice upload. No IBER, reconciliation or response.",
  "Parameters": {
    "Owner": {
      "Type": "String",
      "MinLength": 1
    },
    "ExpiresOn": {
      "Type": "String",
      "AllowedPattern": "[0-9]{4}-[0-9]{2}-[0-9]{2}"
    }
  },
  "Globals": {
    "Function": {
      "Runtime": "python3.12",
      "Architectures": [
        "x86_64"
      ],
      "MemorySize": 128,
      "Timeout": 25,
      "CodeUri": "../src",
      "Tags": {
        "Project": "SealedTelemetryFourStage",
        "Owner": {
          "Ref": "Owner"
        },
        "ExpiresOn": {
          "Ref": "ExpiresOn"
        }
      }
    }
  },
  "Resources": {
    "UploadApi": {
      "Type": "AWS::Serverless::HttpApi",
      "Properties": {
        "StageName": "demo",
        "Auth": {
          "EnableIamAuthorizer": true,
          "DefaultAuthorizer": "AWS_IAM"
        },
        "DefaultRouteSettings": {
          "ThrottlingBurstLimit": 2,
          "ThrottlingRateLimit": 1
        },
        "Tags": {
          "Project": "SealedTelemetryFourStage",
          "Owner": {
            "Ref": "Owner"
          },
          "ExpiresOn": {
            "Ref": "ExpiresOn"
          }
        }
      }
    },
