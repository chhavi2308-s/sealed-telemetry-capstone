{
  "AWSTemplateFormatVersion": "2010-09-09",
  "Transform": "AWS::Serverless-2016-10-31",
  "Description": "Sealed-Telemetry isolated synthetic lab; deployment approval required",
  "Parameters": {
    "LabExposureEnabled": {
      "Type": "String",
      "Default": "false",
      "AllowedValues": [
        "true",
        "false"
      ]
    },
    "Owner": {
      "Type": "String"
    },
    "ExpiresOn": {
      "Type": "String"
    },
    "ReconciliationPolicy": {
      "Type": "String",
      "Default": "{}",
      "Description": "JSON iber Policy fields from measured benign calibration; empty uses provisional lab defaults"
    }
  },
  "Globals": {
    "Function": {
      "Runtime": "python3.12",
      "Timeout": 25,
      "MemorySize": 128,
      "Architectures": [
        "x86_64"
      ],
      "Tags": {
        "Project": "SealedTelemetry",
        "Environment": "Lab",
        "Owner": {
          "Ref": "Owner"
        },
        "ExpiresOn": {
          "Ref": "ExpiresOn"
        }
      }
    }
  },
  "Resources": {
    "EvidenceKey": {
      "Type": "AWS::KMS::Key",
      "Properties": {
        "Description": "Sealed lab evidence encryption",
        "EnableKeyRotation": true,
        "KeyPolicy": {
          "Version": "2012-10-17",
          "Statement": [
            {
              "Effect": "Allow",
              "Principal": {
                "AWS": {
                  "Fn::Sub": "arn:${AWS::Partition}:iam::${AWS::AccountId}:root"
                }
              },
              "Action": "kms:*",
              "Resource": "*"
            }
          ]
        }
      },
      "DeletionPolicy": "Retain",
      "UpdateReplacePolicy": "Retain"
    },
    "Archive": {
      "Type": "AWS::S3::Bucket",
      "Properties": {
        "VersioningConfiguration": {
          "Status": "Enabled"
        },
        "ObjectLockEnabled": true,
        "ObjectLockConfiguration": {
          "ObjectLockEnabled": "Enabled",
          "Rule": {
            "DefaultRetention": {
              "Mode": "GOVERNANCE",
              "Days": 1
            }
          }
        },
        "BucketEncryption": {
          "ServerSideEncryptionConfiguration": [
            {
              "ServerSideEncryptionByDefault": {
                "SSEAlgorithm": "aws:kms",
                "KMSMasterKeyID": {
                  "Fn::GetAtt": [
                    "EvidenceKey",
                    "Arn"
                  ]
                }
              }
            }
          ]
        },
        "PublicAccessBlockConfiguration": {
          "BlockPublicAcls": true,
          "BlockPublicPolicy": true,
          "IgnorePublicAcls": true,
          "RestrictPublicBuckets": true
        }
      },
      "DeletionPolicy": "Retain",
      "UpdateReplacePolicy": "Retain"
    },
    "ArchivePolicy": {
      "Type": "AWS::S3::BucketPolicy",
      "Properties": {
        "Bucket": {
          "Ref": "Archive"
        },
        "PolicyDocument": {
          "Version": "2012-10-17",
          "Statement": [
            {
              "Effect": "Deny",
              "Principal": "*",
              "Action": "s3:*",
              "Resource": [
                {
                  "Fn::GetAtt": [
                    "Archive",
                    "Arn"
                  ]
                },
                {
                  "Fn::Sub": "${Archive.Arn}/*"
                }
              ],
              "Condition": {
                "Bool": {
                  "aws:SecureTransport": "false"
                }
              }
            },
            {
              "Effect": "Deny",
              "Principal": {
                "AWS": {
                  "Fn::GetAtt": [
                    "AppRole",
                    "Arn"
                  ]
                }
              },
              "Action": "s3:*",
              "Resource": [
                {
                  "Fn::GetAtt": [
                    "Archive",
                    "Arn"
                  ]
                },
                {
                  "Fn::Sub": "${Archive.Arn}/*"
                }
              ]
            }
          ]
        }
      }
    },
    "DLQ": {
      "Type": "AWS::SQS::Queue",
      "Properties": {
        "MessageRetentionPeriod": 1209600,
        "SqsManagedSseEnabled": true
      }
    },
    "AuditFailureQueue": {
      "Type": "AWS::SQS::Queue",
      "Properties": {
        "MessageRetentionPeriod": 1209600,
        "SqsManagedSseEnabled": true
      }
    },
    "EvidenceQueue": {
      "Type": "AWS::SQS::Queue",
      "Properties": {
        "VisibilityTimeout": 180,
        "MessageRetentionPeriod": 345600,
        "SqsManagedSseEnabled": true,
        "RedrivePolicy": {
          "deadLetterTargetArn": {
            "Fn::GetAtt": [
              "DLQ",
              "Arn"
            ]
          },
          "maxReceiveCount": 5
        }
      }
    },
    "Events": {
      "Type": "AWS::DynamoDB::Table",
      "Properties": {
        "BillingMode": "PAY_PER_REQUEST",
        "SSESpecification": {
          "SSEEnabled": true
        },
        "AttributeDefinitions": [
          {
            "AttributeName": "event_id",
            "AttributeType": "S"
          },
          {
            "AttributeName": "run_id",
            "AttributeType": "S"
          },
          {
            "AttributeName": "credential_fingerprint",
            "AttributeType": "S"
          }
        ],
        "KeySchema": [
          {
            "AttributeName": "event_id",
            "KeyType": "HASH"
          }
        ],
        "GlobalSecondaryIndexes": [
          {
            "IndexName": "RunIndex",
            "KeySchema": [
              {
                "AttributeName": "run_id",
                "KeyType": "HASH"
              }
            ],
            "Projection": {
              "ProjectionType": "ALL"
            }
          },
          {
            "IndexName": "CredentialIndex",
            "KeySchema": [
              {
                "AttributeName": "credential_fingerprint",
                "KeyType": "HASH"
              }
            ],
            "Projection": {
              "ProjectionType": "ALL"
            }
          }
        ]
      },
      "DeletionPolicy": "Retain",
      "UpdateReplacePolicy": "Retain"
    },
    "Decisions": {
      "Type": "AWS::DynamoDB::Table",
      "Properties": {
        "BillingMode": "PAY_PER_REQUEST",
        "SSESpecification": {
          "SSEEnabled": true
        },
        "AttributeDefinitions": [
          {
            "AttributeName": "case_id",
            "AttributeType": "S"
          },
          {
            "AttributeName": "decision_id",
            "AttributeType": "S"
          }
        ],
        "KeySchema": [
          {
            "AttributeName": "case_id",
            "KeyType": "HASH"
          },
          {
            "AttributeName": "decision_id",
            "KeyType": "RANGE"
          }
        ]
      },
      "DeletionPolicy": "Retain",
      "UpdateReplacePolicy": "Retain"
    },
    "Tokens": {
      "Type": "AWS::DynamoDB::Table",
      "Properties": {
        "BillingMode": "PAY_PER_REQUEST",
        "SSESpecification": {
          "SSEEnabled": true
        },
        "AttributeDefinitions": [
          {
            "AttributeName": "token_hash",
            "AttributeType": "S"
          },
          {
            "AttributeName": "credential_fingerprint",
            "AttributeType": "S"
          }
        ],
        "KeySchema": [
          {
            "AttributeName": "token_hash",
            "KeyType": "HASH"
          }
        ],
        "GlobalSecondaryIndexes": [
          {
            "IndexName": "CredentialIndex",
            "KeySchema": [
              {
                "AttributeName": "credential_fingerprint",
                "KeyType": "HASH"
              }
            ],
            "Projection": {
              "ProjectionType": "ALL"
            }
          }
        ]
      }
    },
    "ProviderOutbox": {
      "Type": "AWS::DynamoDB::Table",
      "Properties": {
        "BillingMode": "PAY_PER_REQUEST",
        "SSESpecification": {
          "SSEEnabled": true
        },
        "AttributeDefinitions": [
          {
            "AttributeName": "event_id",
            "AttributeType": "S"
          },
          {
            "AttributeName": "pending_partition",
            "AttributeType": "S"
          },
          {
            "AttributeName": "created_at",
            "AttributeType": "S"
          }
        ],
        "KeySchema": [
          {
            "AttributeName": "event_id",
            "KeyType": "HASH"
          }
        ],
        "StreamSpecification": {
          "StreamViewType": "NEW_IMAGE"
        },
        "GlobalSecondaryIndexes": [
          {
            "IndexName": "PendingIndex",
            "KeySchema": [
              {
                "AttributeName": "pending_partition",
                "KeyType": "HASH"
              },
              {
                "AttributeName": "created_at",
                "KeyType": "RANGE"
              }
            ],
            "Projection": {
              "ProjectionType": "KEYS_ONLY"
            }
          }
        ]
      },
      "DeletionPolicy": "Retain",
      "UpdateReplacePolicy": "Retain"
    },
    "PseudonymSecret": {
      "Type": "AWS::SecretsManager::Secret",
      "Properties": {
        "Description": "Disposable lab HMAC key; never a real OAuth credential",
        "GenerateSecretString": {
          "PasswordLength": 64,
          "ExcludePunctuation": true
        }
      }
    },
    "FindingsBus": {
      "Type": "AWS::Events::EventBus",
      "Properties": {
        "Name": {
          "Fn::Sub": "${AWS::StackName}-findings"
        }
      }
    },
    "AlarmTopic": {
      "Type": "AWS::SNS::Topic",
      "Properties": {}
    },
    "IntakeApi": {
      "Type": "AWS::Serverless::Api",
      "Properties": {
        "StageName": "lab",
        "EndpointConfiguration": "REGIONAL",
        "Auth": {
          "DefaultAuthorizer": "AWS_IAM"
        },
        "MethodSettings": [
          {
            "ResourcePath": "/*",
            "HttpMethod": "*",
            "ThrottlingBurstLimit": 10,
            "ThrottlingRateLimit": 5
          }
        ],
        "AccessLogSetting": {
          "DestinationArn": {
            "Fn::GetAtt": [
              "IntakeApiLogs",
              "Arn"
            ]
          },
          "Format": "{\"requestId\":\"$context.requestId\",\"status\":\"$context.status\",\"requestTimeEpoch\":\"$context.requestTimeEpoch\"}"
        }
      }
    },
    "IntakeApiLogs": {
      "Type": "AWS::Logs::LogGroup",
      "Properties": {
        "RetentionInDays": 14
      }
    },
    "WorkloadApi": {
      "Type": "AWS::Serverless::Api",
      "Properties": {
        "StageName": "lab",
        "EndpointConfiguration": "REGIONAL",
        "Auth": {
          "DefaultAuthorizer": "AWS_IAM"
        },
        "MethodSettings": [
          {
            "ResourcePath": "/*",
            "HttpMethod": "*",
            "ThrottlingBurstLimit": 10,
            "ThrottlingRateLimit": 5
          }
        ],
        "AccessLogSetting": {
          "DestinationArn": {
            "Fn::GetAtt": [
              "WorkloadApiLogs",
              "Arn"
            ]
          },
          "Format": "{\"requestId\":\"$context.requestId\",\"status\":\"$context.status\",\"requestTimeEpoch\":\"$context.requestTimeEpoch\"}"
        }
      }
    },
    "WorkloadApiLogs": {
      "Type": "AWS::Logs::LogGroup",
      "Properties": {
        "RetentionInDays": 14
      }
    },
    "SaasApi": {
      "Type": "AWS::Serverless::Api",
      "Properties": {
        "StageName": "lab",
        "EndpointConfiguration": "REGIONAL",
        "Auth": {},
        "MethodSettings": [
          {
            "ResourcePath": "/*",
            "HttpMethod": "*",
            "ThrottlingBurstLimit": 10,
            "ThrottlingRateLimit": 5
          }
        ],
        "AccessLogSetting": {
          "DestinationArn": {
            "Fn::GetAtt": [
              "SaasApiLogs",
              "Arn"
            ]
          },
          "Format": "{\"requestId\":\"$context.requestId\",\"status\":\"$context.status\",\"requestTimeEpoch\":\"$context.requestTimeEpoch\"}"
        }
      }
    },
    "SaasApiLogs": {
      "Type": "AWS::Logs::LogGroup",
      "Properties": {
        "RetentionInDays": 14
      }
    },
    "GatewayRole": {
      "Type": "AWS::IAM::Role",
      "Properties": {
        "AssumeRolePolicyDocument": {
          "Version": "2012-10-17",
          "Statement": [
            {
              "Effect": "Allow",
              "Principal": {
                "Service": "lambda.amazonaws.com"
              },
              "Action": "sts:AssumeRole"
            }
          ]
        }
      }
    },
    "AppRole": {
      "Type": "AWS::IAM::Role",
      "Properties": {
        "AssumeRolePolicyDocument": {
          "Version": "2012-10-17",
          "Statement": [
            {
              "Effect": "Allow",
              "Principal": {
                "Service": "lambda.amazonaws.com"
              },
              "Action": "sts:AssumeRole"
            }
          ]
        }
      }
    },
    "IssuerRole": {
      "Type": "AWS::IAM::Role",
      "Properties": {
        "AssumeRolePolicyDocument": {
          "Version": "2012-10-17",
          "Statement": [
            {
              "Effect": "Allow",
              "Principal": {
                "Service": "lambda.amazonaws.com"
              },
              "Action": "sts:AssumeRole"
            }
          ]
        }
      }
    },
    "SaasRole": {
      "Type": "AWS::IAM::Role",
      "Properties": {
        "AssumeRolePolicyDocument": {
          "Version": "2012-10-17",
          "Statement": [
            {
              "Effect": "Allow",
              "Principal": {
                "Service": "lambda.amazonaws.com"
              },
              "Action": "sts:AssumeRole"
            }
          ]
        }
      }
    },
    "AuditForwarderRole": {
      "Type": "AWS::IAM::Role",
      "Properties": {
        "AssumeRolePolicyDocument": {
          "Version": "2012-10-17",
          "Statement": [
            {
              "Effect": "Allow",
              "Principal": {
                "Service": "lambda.amazonaws.com"
              },
              "Action": "sts:AssumeRole"
            }
          ]
        }
      }
    },
    "CollectorRole": {
      "Type": "AWS::IAM::Role",
      "Properties": {
        "AssumeRolePolicyDocument": {
          "Version": "2012-10-17",
          "Statement": [
            {
              "Effect": "Allow",
              "Principal": {
                "Service": "lambda.amazonaws.com"
              },
              "Action": "sts:AssumeRole"
            }
          ]
        }
      }
    },
    "NormalizerRole": {
      "Type": "AWS::IAM::Role",
      "Properties": {
        "AssumeRolePolicyDocument": {
          "Version": "2012-10-17",
          "Statement": [
            {
              "Effect": "Allow",
              "Principal": {
                "Service": "lambda.amazonaws.com"
              },
              "Action": "sts:AssumeRole"
            }
          ]
        }
      }
    },
    "DetectorRole": {
      "Type": "AWS::IAM::Role",
      "Properties": {
        "AssumeRolePolicyDocument": {
          "Version": "2012-10-17",
          "Statement": [
            {
              "Effect": "Allow",
              "Principal": {
                "Service": "lambda.amazonaws.com"
              },
              "Action": "sts:AssumeRole"
            }
          ]
        }
      }
    },
    "CollectorFunction": {
      "Type": "AWS::Serverless::Function",
      "Properties": {
        "CodeUri": "../src",
        "Handler": "sealed_telemetry.aws_handlers.collector",
        "Role": {
          "Fn::GetAtt": [
            "CollectorRole",
            "Arn"
          ]
        },
        "Environment": {
          "Variables": {
            "QUEUE_URL": {
              "Ref": "EvidenceQueue"
            },
            "SOURCE_ROLES": {
              "Fn::Sub": [
                "{\"app\":\"${A}\",\"gateway\":\"${G}\",\"provider\":\"${P}\",\"responder\":\"${R}\",\"health\":\"${H}\"}",
                {
                  "A": {
                    "Fn::GetAtt": [
                      "AppRole",
                      "Arn"
                    ]
                  },
                  "G": {
                    "Fn::GetAtt": [
                      "GatewayRole",
                      "Arn"
                    ]
                  },
                  "P": {
                    "Fn::GetAtt": [
                      "AuditForwarderRole",
                      "Arn"
                    ]
                  },
                  "R": {
                    "Fn::GetAtt": [
                      "ResponderRole",
                      "Arn"
                    ]
                  },
                  "H": {
                    "Fn::GetAtt": [
                      "HealthRole",
                      "Arn"
                    ]
                  }
                }
              ]
            }
          }
        },
        "Events": {
          "Intake": {
            "Type": "Api",
            "Properties": {
              "RestApiId": {
                "Ref": "IntakeApi"
              },
              "Path": "/evidence",
              "Method": "post"
            }
          }
        }
      }
    },
    "CollectorLogs": {
      "Type": "AWS::Logs::LogGroup",
      "Properties": {
        "LogGroupName": {
          "Fn::Sub": "/aws/lambda/${CollectorFunction}"
        },
        "RetentionInDays": 14
      }
    },
    "NormalizerFunction": {
      "Type": "AWS::Serverless::Function",
      "Properties": {
        "CodeUri": "../src",
        "Handler": "sealed_telemetry.aws_handlers.normalizer",
        "Role": {
          "Fn::GetAtt": [
            "NormalizerRole",
            "Arn"
          ]
        },
        "Environment": {
          "Variables": {
            "EVENT_TABLE": {
              "Ref": "Events"
            },
            "ARCHIVE_BUCKET": {
              "Ref": "Archive"
            },
            "ACTIVE_TABLE": {
              "Ref": "ActiveCredentials"
            },
            "HEALTH_TABLE": {
              "Ref": "SourceHealth"
            },
            "POLICY_JSON": {
              "Ref": "ReconciliationPolicy"
            }
          }
        },
        "Events": {
          "Queue": {
            "Type": "SQS",
            "Properties": {
              "Queue": {
                "Fn::GetAtt": [
                  "EvidenceQueue",
                  "Arn"
                ]
              },
              "BatchSize": 10,
              "FunctionResponseTypes": [
                "ReportBatchItemFailures"
              ]
            }
          }
        }
      }
    },
    "NormalizerLogs": {
      "Type": "AWS::Logs::LogGroup",
      "Properties": {
        "LogGroupName": {
          "Fn::Sub": "/aws/lambda/${NormalizerFunction}"
        },
        "RetentionInDays": 14
      }
    },
    "IssuerFunction": {
      "Type": "AWS::Serverless::Function",
      "Properties": {
        "CodeUri": "../src",
        "Handler": "sealed_telemetry.cloud_lab.issuer",
        "Role": {
          "Fn::GetAtt": [
            "IssuerRole",
            "Arn"
          ]
        },
        "Environment": {
          "Variables": {
            "TOKEN_TABLE": {
              "Ref": "Tokens"
            },
            "PSEUDONYM_SECRET": {
              "Ref": "PseudonymSecret"
            },
            "CREDENTIAL_KEY": {
              "Ref": "CredentialKey"
            }
          }
        },
        "Events": {
          "IssueToken": {
            "Type": "Api",
            "Properties": {
              "RestApiId": {
                "Ref": "WorkloadApi"
              },
              "Path": "/oauth/token",
              "Method": "post"
            }
          }
        }
      }
    },
    "IssuerLogs": {
      "Type": "AWS::Logs::LogGroup",
      "Properties": {
        "LogGroupName": {
          "Fn::Sub": "/aws/lambda/${IssuerFunction}"
        },
        "RetentionInDays": 14
      }
    },
    "SaasFunction": {
      "Type": "AWS::Serverless::Function",
      "Properties": {
        "CodeUri": "../src",
        "Handler": "sealed_telemetry.cloud_lab.saas",
        "Role": {
          "Fn::GetAtt": [
            "SaasRole",
            "Arn"
          ]
        },
        "Environment": {
          "Variables": {
            "TOKEN_TABLE": {
              "Ref": "Tokens"
            },
            "OUTBOX_TABLE": {
              "Ref": "ProviderOutbox"
            }
          }
        },
        "Events": {
          "Read": {
            "Type": "Api",
            "Properties": {
              "RestApiId": {
                "Ref": "SaasApi"
              },
              "Path": "/records",
              "Method": "get"
            }
          },
          "Export": {
            "Type": "Api",
            "Properties": {
              "RestApiId": {
                "Ref": "SaasApi"
              },
              "Path": "/export",
              "Method": "get"
            }
          }
        }
      }
    },
    "SaasLogs": {
      "Type": "AWS::Logs::LogGroup",
      "Properties": {
        "LogGroupName": {
          "Fn::Sub": "/aws/lambda/${SaasFunction}"
        },
        "RetentionInDays": 14
      }
    },
    "AuditForwarderFunction": {
      "Type": "AWS::Serverless::Function",
      "Properties": {
        "CodeUri": "../src",
        "Handler": "sealed_telemetry.cloud_lab.audit_forwarder",
        "Role": {
          "Fn::GetAtt": [
            "AuditForwarderRole",
            "Arn"
          ]
        },
        "Environment": {
          "Variables": {
            "INTAKE_URL": {
              "Fn::Sub": "https://${IntakeApi}.execute-api.${AWS::Region}.${AWS::URLSuffix}/lab/evidence"
            },
            "OUTBOX_TABLE": {
              "Ref": "ProviderOutbox"
            }
          }
        },
        "Events": {
          "Outbox": {
            "Type": "DynamoDB",
            "Properties": {
              "Stream": {
                "Fn::GetAtt": [
                  "ProviderOutbox",
                  "StreamArn"
                ]
              },
              "StartingPosition": "TRIM_HORIZON",
              "BatchSize": 10,
              "MaximumRetryAttempts": 5,
              "MaximumRecordAgeInSeconds": 3600,
              "BisectBatchOnFunctionError": true,
              "FunctionResponseTypes": [
                "ReportBatchItemFailures"
              ],
              "DestinationConfig": {
                "OnFailure": {
                  "Type": "SQS",
                  "Destination": {
                    "Fn::GetAtt": [
                      "AuditFailureQueue",
                      "Arn"
                    ]
                  }
                }
              }
            }
          }
        }
      }
    },
    "AuditForwarderLogs": {
      "Type": "AWS::Logs::LogGroup",
      "Properties": {
        "LogGroupName": {
          "Fn::Sub": "/aws/lambda/${AuditForwarderFunction}"
        },
        "RetentionInDays": 14
      }
    },
    "AppFunction": {
      "Type": "AWS::Serverless::Function",
      "Properties": {
        "CodeUri": "../src",
        "Handler": "sealed_telemetry.cloud_lab.app",
        "Role": {
          "Fn::GetAtt": [
            "AppRole",
            "Arn"
          ]
        },
        "Environment": {
          "Variables": {
            "INTAKE_URL": {
              "Fn::Sub": "https://${IntakeApi}.execute-api.${AWS::Region}.${AWS::URLSuffix}/lab/evidence"
            },
            "SAAS_URL": {
              "Fn::Sub": "https://${SaasApi}.execute-api.${AWS::Region}.${AWS::URLSuffix}/lab/records"
            }
          }
        }
      }
    },
    "AppLogs": {
      "Type": "AWS::Logs::LogGroup",
      "Properties": {
        "LogGroupName": {
          "Fn::Sub": "/aws/lambda/${AppFunction}"
        },
        "RetentionInDays": 14
      }
    },
    "GatewayFunction": {
      "Type": "AWS::Serverless::Function",
      "Properties": {
        "CodeUri": "../src",
        "Handler": "sealed_telemetry.cloud_lab.gateway",
        "Role": {
          "Fn::GetAtt": [
            "GatewayRole",
            "Arn"
          ]
        },
        "Environment": {
          "Variables": {
            "INTAKE_URL": {
              "Fn::Sub": "https://${IntakeApi}.execute-api.${AWS::Region}.${AWS::URLSuffix}/lab/evidence"
            },
            "ISSUER_FUNCTION": {
              "Ref": "IssuerFunction"
            },
            "APP_FUNCTION": {
              "Ref": "AppFunction"
            },
            "LAB_EXPOSURE_ENABLED": {
              "Ref": "LabExposureEnabled"
            }
          }
        },
        "Events": {
          "Run": {
            "Type": "Api",
            "Properties": {
              "RestApiId": {
                "Ref": "WorkloadApi"
              },
              "Path": "/run",
              "Method": "post"
            }
          }
        }
      }
    },
    "GatewayLogs": {
      "Type": "AWS::Logs::LogGroup",
      "Properties": {
        "LogGroupName": {
