    "WorkflowRole": {
      "Type": "AWS::IAM::Role",
      "Properties": {
        "AssumeRolePolicyDocument": {
          "Version": "2012-10-17",
          "Statement": [
            {
              "Effect": "Allow",
              "Principal": {
                "Service": "states.amazonaws.com"
              },
              "Action": "sts:AssumeRole"
            }
          ]
        },
        "Policies": [
          {
            "PolicyName": "InvokeResponse",
            "PolicyDocument": {
              "Version": "2012-10-17",
              "Statement": [
                {
                  "Effect": "Allow",
                  "Action": [
                    "lambda:InvokeFunction"
                  ],
                  "Resource": [
                    {
                      "Fn::GetAtt": [
                        "ResponderFunction",
                        "Arn"
                      ]
                    },
                    {
                      "Fn::GetAtt": [
                        "ApprovalBrokerFunction",
                        "Arn"
                      ]
                    }
                  ]
                }
              ]
            }
          }
        ]
      }
    },
    "ResponseWorkflow": {
      "Type": "AWS::StepFunctions::StateMachine",
      "Properties": {
        "RoleArn": {
          "Fn::GetAtt": [
            "WorkflowRole",
            "Arn"
          ]
        },
        "Definition": {
          "StartAt": "RequestApproval",
          "States": {
            "ApprovalGate": {
              "Type": "Choice",
              "Choices": [
                {
                  "Variable": "$.approval.approved",
                  "BooleanEquals": true,
                  "Next": "InitializeRetry"
                }
              ],
              "Default": "Rejected"
            },
            "Contain": {
              "Type": "Task",
              "Resource": {
                "Fn::GetAtt": [
                  "ResponderFunction",
                  "Arn"
                ]
              },
              "ResultPath": "$.response",
              "TimeoutSeconds": 45,
              "Retry": [
                {
                  "ErrorEquals": [
                    "States.TaskFailed",
                    "States.Timeout"
                  ],
                  "IntervalSeconds": 5,
                  "MaxAttempts": 2,
                  "BackoffRate": 2
                }
              ],
              "Next": "Verify",
              "Parameters": {
                "decision_id.$": "$.decision_id",
                "run_id.$": "$.run_id",
                "state.$": "$.state",
                "credential_fingerprint.$": "$.credential_fingerprint",
                "approved.$": "$.approval.approved",
                "approved_by.$": "$.approval.approved_by",
                "approval_id.$": "$.approval.approval_id",
                "disable_integration.$": "$.approval.disable_integration"
              }
            },
            "Verify": {
              "Type": "Choice",
              "Choices": [
                {
                  "Variable": "$.response.status",
                  "StringEquals": "verified",
                  "Next": "Verified"
                },
                {
                  "And": [
                    {
                      "Variable": "$.response.retryable",
                      "BooleanEquals": true
                    },
                    {
                      "Variable": "$.retry_count",
                      "NumericLessThan": 5
                    }
                  ],
                  "Next": "RetryWait"
                }
              ],
              "Default": "Unverified"
            },
            "Verified": {
              "Type": "Succeed"
            },
            "Unverified": {
              "Type": "Fail",
              "Error": "ContainmentNotVerified"
            },
            "RequestApproval": {
              "Type": "Task",
              "Resource": {
                "Fn::Sub": "arn:${AWS::Partition}:states:::lambda:invoke.waitForTaskToken"
              },
              "Parameters": {
                "FunctionName": {
                  "Ref": "ApprovalBrokerFunction"
                },
                "Payload": {
                  "task_token.$": "$$.Task.Token",
                  "execution_arn.$": "$$.Execution.Id",
                  "finding.$": "$"
                }
              },
              "TimeoutSeconds": 3600,
              "ResultPath": "$.approval",
              "Next": "ApprovalGate",
              "Catch": [
                {
                  "ErrorEquals": [
                    "States.Timeout"
                  ],
                  "Next": "ApprovalExpired"
                }
              ]
            },
            "ApprovalExpired": {
              "Type": "Fail",
              "Error": "ApprovalExpired"
            },
            "Rejected": {
              "Type": "Succeed"
            },
            "InitializeRetry": {
              "Type": "Pass",
              "Result": 0,
              "ResultPath": "$.retry_count",
              "Next": "Contain"
            },
            "RetryWait": {
              "Type": "Wait",
              "Seconds": 15,
              "Next": "IncrementRetry"
            },
            "IncrementRetry": {
              "Type": "Pass",
              "Parameters": {
                "count.$": "States.MathAdd($.retry_count, 1)"
              },
              "ResultPath": "$.counter",
              "Next": "SetRetry"
            },
            "SetRetry": {
              "Type": "Pass",
              "InputPath": "$.counter.count",
              "ResultPath": "$.retry_count",
              "Next": "Contain"
            }
          },
          "TimeoutSeconds": 4500
        }
      }
    },
