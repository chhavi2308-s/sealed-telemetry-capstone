    "CloudTrailIngestFunction": {
      "Type": "AWS::Serverless::Function",
      "Properties": {
        "CodeUri": "../src",
        "Handler": "sealed_telemetry.telemetry.cloudtrail",
        "Role": {
          "Fn::GetAtt": [
            "CloudTrailIngestRole",
            "Arn"
          ]
        },
        "Timeout": 90,
        "MemorySize": 256,
        "Environment": {
          "Variables": {
            "CLOUDTRAIL_QUEUE_URL": {
              "Ref": "CloudTrailQueue"
            },
            "TRAIL_BUCKET": {
              "Fn::Sub": [
                "${AWS::AccountId}-${AWS::Region}-sealed-audit-${Suffix}",
                {
                  "Suffix": {
                    "Fn::Select": [
                      0,
                      {
                        "Fn::Split": [
                          "-",
                          {
                            "Fn::Select": [
                              2,
                              {
                                "Fn::Split": [
                                  "/",
                                  {
                                    "Ref": "AWS::StackId"
                                  }
                                ]
                              }
                            ]
                          }
                        ]
                      }
                    ]
                  }
                }
              ]
            }
          }
        },
        "EventInvokeConfig": {
          "MaximumEventAgeInSeconds": 3600,
          "MaximumRetryAttempts": 2,
          "DestinationConfig": {
            "OnFailure": {
              "Type": "SQS",
              "Destination": {
                "Fn::GetAtt": [
                  "TelemetryFailureQueue",
                  "Arn"
                ]
              }
            }
          }
        }
      }
