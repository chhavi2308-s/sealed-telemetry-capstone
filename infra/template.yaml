            "AttributeName": "approval_id",
            "KeyType": "HASH"
          }
        ],
        "TimeToLiveSpecification": {
          "AttributeName": "expires_at",
          "Enabled": true
        },
        "GlobalSecondaryIndexes": [
          {
            "IndexName": "StatusIndex",
            "KeySchema": [
              {
                "AttributeName": "status",
                "KeyType": "HASH"
              },
              {
                "AttributeName": "requested_at",
                "KeyType": "RANGE"
              }
            ],
            "Projection": {
              "ProjectionType": "ALL"
            }
          }
        ]
      }
    },
    "ResponseHistory": {
      "Type": "AWS::DynamoDB::Table",
      "DeletionPolicy": "Retain",
      "UpdateReplacePolicy": "Retain",
      "Properties": {
        "BillingMode": "PAY_PER_REQUEST",
        "SSESpecification": {
          "SSEEnabled": true
        },
        "PointInTimeRecoverySpecification": {
          "PointInTimeRecoveryEnabled": true
        },
        "AttributeDefinitions": [
          {
            "AttributeName": "response_id",
            "AttributeType": "S"
          },
          {
            "AttributeName": "attempt",
            "AttributeType": "N"
          }
        ],
        "KeySchema": [
          {
            "AttributeName": "response_id",
            "KeyType": "HASH"
          },
          {
            "AttributeName": "attempt",
            "KeyType": "RANGE"
          }
        ]
      }
    },
    "ApprovalKey": {
      "Type": "AWS::KMS::Key",
      "DeletionPolicy": "Retain",
      "UpdateReplacePolicy": "Retain",
      "Properties": {
        "Description": "Encrypt callback task tokens; never returned to operators",
        "EnableKeyRotation": true,
        "KeyPolicy": {
          "Version": "2012-10-17",
          "Statement": [
            {
              "Effect": "Allow",
              "Principal": {
                "AWS": {
                  "Fn::Sub": "arn:${AWS::Partition}:iam::${AWS::AccountId}:root"
                }
              },
              "Action": "kms:*",
              "Resource": "*"
            }
          ]
        }
      }
    },
    "OperatorApi": {
      "Type": "AWS::Serverless::Api",
      "Properties": {
        "StageName": "lab",
        "EndpointConfiguration": "REGIONAL",
        "Auth": {
          "DefaultAuthorizer": "AWS_IAM"
        },
        "MethodSettings": [
          {
            "ResourcePath": "/*",
            "HttpMethod": "*",
            "ThrottlingBurstLimit": 10,
            "ThrottlingRateLimit": 5
          }
        ]
      }
    },
    "ApprovalBrokerRole": {
      "Type": "AWS::IAM::Role",
      "Properties": {
        "AssumeRolePolicyDocument": {
          "Version": "2012-10-17",
          "Statement": [
            {
              "Effect": "Allow",
              "Principal": {
                "Service": "lambda.amazonaws.com"
              },
              "Action": "sts:AssumeRole"
            }
          ]
        }
      }
    },
    "ApprovalBrokerFunction": {
      "Type": "AWS::Serverless::Function",
      "Properties": {
        "CodeUri": "../src",
        "Handler": "sealed_telemetry.approvals.broker",
        "Role": {
          "Fn::GetAtt": [
            "ApprovalBrokerRole",
            "Arn"
          ]
        },
        "Environment": {
          "Variables": {
            "APPROVAL_TABLE": {
              "Ref": "Approvals"
            },
            "APPROVAL_KEY": {
              "Ref": "ApprovalKey"
            }
          }
        }
      }
    },
    "ApprovalBrokerLogs": {
      "Type": "AWS::Logs::LogGroup",
      "Properties": {
        "LogGroupName": {
          "Fn::Sub": "/aws/lambda/${ApprovalBrokerFunction}"
        },
        "RetentionInDays": 14
      }
    },
    "ApprovalBrokerPolicy": {
      "Type": "AWS::IAM::Policy",
      "Properties": {
        "PolicyName": "ApprovalBrokerAccess",
        "Roles": [
          {
            "Ref": "ApprovalBrokerRole"
          }
        ],
        "PolicyDocument": {
          "Version": "2012-10-17",
          "Statement": [
            {
              "Effect": "Allow",
              "Action": [
                "dynamodb:PutItem",
                "dynamodb:GetItem"
              ],
              "Resource": {
                "Fn::GetAtt": [
                  "Approvals",
                  "Arn"
                ]
              }
            },
            {
              "Effect": "Allow",
              "Action": [
                "kms:Encrypt"
              ],
              "Resource": {
                "Fn::GetAtt": [
                  "ApprovalKey",
                  "Arn"
                ]
              },
              "Condition": {
                "StringEquals": {
                  "kms:EncryptionContext:purpose": "sealed-approval"
                }
              }
            },
            {
              "Effect": "Allow",
              "Action": [
                "logs:CreateLogStream",
                "logs:PutLogEvents"
              ],
              "Resource": {
                "Fn::Sub": "${ApprovalBrokerLogs.Arn}:*"
              }
            }
          ]
        }
      }
    },
    "ApprovalApiRole": {
      "Type": "AWS::IAM::Role",
      "Properties": {
        "AssumeRolePolicyDocument": {
          "Version": "2012-10-17",
          "Statement": [
            {
              "Effect": "Allow",
              "Principal": {
                "Service": "lambda.amazonaws.com"
              },
              "Action": "sts:AssumeRole"
            }
          ]
        }
      }
    },
    "ApprovalApiFunction": {
      "Type": "AWS::Serverless::Function",
      "Properties": {
        "CodeUri": "../src",
        "Handler": "sealed_telemetry.approvals.api",
        "Role": {
          "Fn::GetAtt": [
            "ApprovalApiRole",
            "Arn"
          ]
        },
        "Environment": {
          "Variables": {
            "APPROVAL_TABLE": {
              "Ref": "Approvals"
            },
            "APPROVAL_KEY": {
              "Ref": "ApprovalKey"
            },
            "OPERATOR_PRINCIPAL": {
              "Ref": "OperatorPrincipalArn"
            },
            "INTAKE_URL": {
              "Fn::Sub": "https://${IntakeApi}.execute-api.${AWS::Region}.${AWS::URLSuffix}/lab/evidence"
            }
          }
        },
        "Events": {
          "List": {
            "Type": "Api",
            "Properties": {
              "RestApiId": {
                "Ref": "OperatorApi"
              },
              "Path": "/v1/approvals",
              "Method": "get"
            }
          },
          "Get": {
            "Type": "Api",
            "Properties": {
              "RestApiId": {
                "Ref": "OperatorApi"
              },
              "Path": "/v1/approvals/{approval_id}",
              "Method": "get"
            }
          },
          "Decide": {
            "Type": "Api",
            "Properties": {
              "RestApiId": {
                "Ref": "OperatorApi"
              },
              "Path": "/v1/approvals/{approval_id}",
              "Method": "post"
            }
          }
        }
      }
    },
    "ApprovalApiLogs": {
      "Type": "AWS::Logs::LogGroup",
      "Properties": {
        "LogGroupName": {
          "Fn::Sub": "/aws/lambda/${ApprovalApiFunction}"
        },
        "RetentionInDays": 14
      }
    },
    "ApprovalApiPolicy": {
      "Type": "AWS::IAM::Policy",
      "Properties": {
        "PolicyName": "ApprovalApiAccess",
        "Roles": [
          {
            "Ref": "ApprovalApiRole"
          }
        ],
        "PolicyDocument": {
          "Version": "2012-10-17",
          "Statement": [
            {
              "Effect": "Allow",
              "Action": [
                "dynamodb:GetItem",
                "dynamodb:UpdateItem"
              ],
              "Resource": {
                "Fn::GetAtt": [
                  "Approvals",
                  "Arn"
                ]
              }
            },
            {
              "Effect": "Allow",
              "Action": [
                "dynamodb:Query"
              ],
              "Resource": {
                "Fn::Sub": "${Approvals.Arn}/index/StatusIndex"
              }
            },
            {
              "Effect": "Allow",
              "Action": [
                "kms:Decrypt"
              ],
              "Resource": {
                "Fn::GetAtt": [
                  "ApprovalKey",
                  "Arn"
                ]
              },
              "Condition": {
                "StringEquals": {
                  "kms:EncryptionContext:purpose": "sealed-approval"
                }
              }
            },
            {
              "Effect": "Allow",
              "Action": [
                "states:SendTaskSuccess"
              ],
              "Resource": "*"
            },
            {
              "Effect": "Allow",
              "Action": [
                "states:GetExecutionHistory"
              ],
              "Resource": {
                "Fn::Sub": "arn:${AWS::Partition}:states:${AWS::Region}:${AWS::AccountId}:execution:${ResponseWorkflow.Name}:*"
              }
            },
            {
              "Effect": "Allow",
              "Action": [
                "execute-api:Invoke"
              ],
              "Resource": {
                "Fn::Sub": "arn:${AWS::Partition}:execute-api:${AWS::Region}:${AWS::AccountId}:${IntakeApi}/lab/POST/evidence"
              }
            },
            {
              "Effect": "Allow",
              "Action": [
                "logs:CreateLogStream",
                "logs:PutLogEvents"
              ],
              "Resource": {
                "Fn::Sub": "${ApprovalApiLogs.Arn}:*"
              }
            }
          ]
        }
      }
    },
    "CasesRole": {
      "Type": "AWS::IAM::Role",
      "Properties": {
        "AssumeRolePolicyDocument": {
          "Version": "2012-10-17",
          "Statement": [
            {
              "Effect": "Allow",
              "Principal": {
                "Service": "lambda.amazonaws.com"
              },
              "Action": "sts:AssumeRole"
            }
          ]
        }
      }
    },
    "CasesFunction": {
      "Type": "AWS::Serverless::Function",
      "Properties": {
        "CodeUri": "../src",
        "Handler": "sealed_telemetry.approvals.cases",
        "Role": {
          "Fn::GetAtt": [
            "CasesRole",
            "Arn"
          ]
        },
        "Environment": {
          "Variables": {
            "DECISION_TABLE": {
              "Ref": "Decisions"
            },
            "OPERATOR_PRINCIPAL": {
              "Ref": "OperatorPrincipalArn"
            }
          }
        },
        "Events": {
          "Get": {
            "Type": "Api",
            "Properties": {
              "RestApiId": {
                "Ref": "OperatorApi"
              },
              "Path": "/v1/cases/{case_id}",
              "Method": "get"
            }
          }
        }
      }
    },
    "CasesLogs": {
      "Type": "AWS::Logs::LogGroup",
      "Properties": {
        "LogGroupName": {
          "Fn::Sub": "/aws/lambda/${CasesFunction}"
        },
        "RetentionInDays": 14
      }
    },
    "CasesPolicy": {
      "Type": "AWS::IAM::Policy",
      "Properties": {
        "PolicyName": "CasesAccess",
        "Roles": [
          {
            "Ref": "CasesRole"
          }
        ],
        "PolicyDocument": {
          "Version": "2012-10-17",
          "Statement": [
            {
              "Effect": "Allow",
              "Action": [
                "dynamodb:Query"
              ],
              "Resource": {
                "Fn::GetAtt": [
                  "Decisions",
                  "Arn"
                ]
              }
            },
            {
              "Effect": "Allow",
              "Action": [
                "logs:CreateLogStream",
                "logs:PutLogEvents"
              ],
              "Resource": {
                "Fn::Sub": "${CasesLogs.Arn}:*"
              }
            }
          ]
        }
      }
    },
    "DispatchRole": {
      "Type": "AWS::IAM::Role",
      "Properties": {
        "AssumeRolePolicyDocument": {
          "Version": "2012-10-17",
          "Statement": [
            {
              "Effect": "Allow",
              "Principal": {
                "Service": "lambda.amazonaws.com"
              },
              "Action": "sts:AssumeRole"
            }
          ]
        }
      }
    },
    "DispatchFunction": {
      "Type": "AWS::Serverless::Function",
      "Properties": {
        "CodeUri": "../src",
        "Handler": "sealed_telemetry.approvals.dispatch",
        "Role": {
          "Fn::GetAtt": [
            "DispatchRole",
            "Arn"
          ]
        },
        "Environment": {
          "Variables": {
            "WORKFLOW_ARN": {
              "Ref": "ResponseWorkflow"
            }
          }
        }
      }
    },
    "DispatchLogs": {
      "Type": "AWS::Logs::LogGroup",
      "Properties": {
        "LogGroupName": {
          "Fn::Sub": "/aws/lambda/${DispatchFunction}"
        },
        "RetentionInDays": 14
      }
    },
    "DispatchPolicy": {
      "Type": "AWS::IAM::Policy",
      "Properties": {
        "PolicyName": "StartReviewedWorkflow",
        "Roles": [
          {
            "Ref": "DispatchRole"
          }
        ],
        "PolicyDocument": {
          "Version": "2012-10-17",
          "Statement": [
            {
              "Effect": "Allow",
              "Action": [
                "states:StartExecution"
              ],
              "Resource": {
                "Ref": "ResponseWorkflow"
              }
            },
            {
              "Effect": "Allow",
              "Action": [
                "logs:CreateLogStream",
                "logs:PutLogEvents"
              ],
              "Resource": {
                "Fn::Sub": "${DispatchLogs.Arn}:*"
              }
            },
            {
              "Effect": "Allow",
              "Action": [
                "sqs:SendMessage"
              ],
              "Resource": {
                "Fn::GetAtt": [
                  "AuditFailureQueue",
                  "Arn"
                ]
              }
            }
          ]
        }
      }
    },
    "DispatchInvokePermission": {
      "Type": "AWS::Lambda::Permission",
      "Properties": {
        "Action": "lambda:InvokeFunction",
        "FunctionName": {
          "Ref": "DispatchFunction"
        },
        "Principal": "events.amazonaws.com",
        "SourceAccount": {
          "Ref": "AWS::AccountId"
        },
        "SourceArn": {
          "Fn::GetAtt": [
            "FindingRoute",
            "Arn"
          ]
        }
      }
    },
    "DispatchAsync": {
      "Type": "AWS::Lambda::EventInvokeConfig",
      "Properties": {
        "FunctionName": {
          "Ref": "DispatchFunction"
        },
        "Qualifier": "$LATEST",
        "MaximumEventAgeInSeconds": 3600,
        "MaximumRetryAttempts": 2,
        "DestinationConfig": {
          "OnFailure": {
            "Destination": {
              "Fn::GetAtt": [
                "AuditFailureQueue",
                "Arn"
              ]
            }
          }
        }
      }
    },
    "ReplayRole": {
      "Type": "AWS::IAM::Role",
      "Properties": {
        "AssumeRolePolicyDocument": {
          "Version": "2012-10-17",
          "Statement": [
            {
              "Effect": "Allow",
              "Principal": {
                "Service": "lambda.amazonaws.com"
              },
              "Action": "sts:AssumeRole"
            }
          ]
        }
      }
    },
    "ReplayFunction": {
      "Type": "AWS::Serverless::Function",
      "Properties": {
        "CodeUri": "../src",
        "Handler": "sealed_telemetry.redrive.outbox_replay",
        "Role": {
          "Fn::GetAtt": [
            "ReplayRole",
            "Arn"
          ]
        },
        "Timeout": 90,
        "Environment": {
          "Variables": {
            "OUTBOX_TABLE": {
              "Ref": "Outbox"
            },
            "PROVIDER_QUEUE_URL": {
              "Ref": "ProviderQueue"
            }
          }
        }
      }
    },
    "ReplayLogs": {
      "Type": "AWS::Logs::LogGroup",
      "Properties": {
        "LogGroupName": {
          "Fn::Sub": "/aws/lambda/${ReplayFunction}"
        },
        "RetentionInDays": 14
      }
    },
    "ReplayPolicy": {
      "Type": "AWS::IAM::Policy",
      "Properties": {
        "PolicyName": "SelectedOutboxReplay",
        "Roles": [
          {
            "Ref": "ReplayRole"
          }
        ],
        "PolicyDocument": {
          "Version": "2012-10-17",
          "Statement": [
            {
              "Effect": "Allow",
              "Action": [
                "dynamodb:GetItem"
              ],
              "Resource": {
                "Fn::GetAtt": [
                  "Outbox",
                  "Arn"
                ]
              }
            },
            {
              "Effect": "Allow",
              "Action": [
                "sqs:SendMessage"
              ],
              "Resource": {
                "Fn::GetAtt": [
                  "ProviderQueue",
                  "Arn"
                ]
              }
            },
            {
              "Effect": "Allow",
              "Action": [
                "logs:CreateLogStream",
                "logs:PutLogEvents"
              ],
              "Resource": {
                "Fn::Sub": "${ReplayLogs.Arn}:*"
              }
            }
          ]
        }
      }
    }
  },
  "Outputs": {
    "WorkloadUrl": {
      "Value": {
        "Fn::Sub": "https://${WorkloadApi}.execute-api.${AWS::Region}.${AWS::URLSuffix}/lab/run"
      }
    },
    "SaasUrl": {
      "Value": {
        "Fn::Sub": "https://${SaasApi}.execute-api.${AWS::Region}.${AWS::URLSuffix}/lab/records"
      }
    },
    "ArchiveBucket": {
      "Value": {
        "Ref": "Archive"
      }
    },
    "EvidenceTable": {
      "Value": {
        "Ref": "Events"
      }
    },
    "DecisionTable": {
      "Value": {
        "Ref": "Decisions"
      }
    },
    "FindingsBus": {
      "Value": {
        "Ref": "FindingsBus"
      }
    },
    "AlarmTopic": {
      "Value": {
        "Ref": "AlarmTopic"
      }
    },
    "ResponseWorkflow": {
      "Value": {
        "Ref": "ResponseWorkflow"
      }
    },
    "OAuthTokenUrl": {
      "Value": {
        "Fn::Sub": "https://${WorkloadApi}.execute-api.${AWS::Region}.${AWS::URLSuffix}/lab/oauth/token"
      }
    },
    "TrailBucket": {
      "Value": {
        "Ref": "TrailBucket"
      }
    },
    "OperatorApiUrl": {
      "Value": {
        "Fn::Sub": "https://${OperatorApi}.execute-api.${AWS::Region}.${AWS::URLSuffix}/lab"
      }
    }
  },
  "Conditions": {
    "SupplementaryEnabled": {
      "Fn::Equals": [
        {
          "Ref": "EnableSupplementary"
        },
        "true"
      ]
    }
  }
}
