    "WorkflowRole": {
      "Type": "AWS::IAM::Role",
      "Properties": {
        "AssumeRolePolicyDocument": {
          "Version": "2012-10-17",
          "Statement": [
            {
              "Effect": "Allow",
              "Principal": {
                "Service": "states.amazonaws.com"
              },
              "Action": "sts:AssumeRole"
            }
          ]
        },
        "Policies": [
          {
            "PolicyName": "InvokeResponse",
            "PolicyDocument": {
              "Version": "2012-10-17",
              "Statement": [
                {
                  "Effect": "Allow",
                  "Action": [
                    "lambda:InvokeFunction"
                  ],
                  "Resource": {
                    "Fn::GetAtt": [
                      "ResponderFunction",
                      "Arn"
                    ]
                  }
                }
              ]
            }
          }
        ]
      }
    },
    "ResponseWorkflow": {
      "Type": "AWS::StepFunctions::StateMachine",
      "Properties": {
        "RoleArn": {
          "Fn::GetAtt": [
            "WorkflowRole",
            "Arn"
          ]
        },
        "Definition": {
          "StartAt": "ApprovalGate",
          "States": {
            "ApprovalGate": {
              "Type": "Choice",
              "Choices": [
                {
                  "Variable": "$.approved",
                  "BooleanEquals": true,
                  "Next": "Contain"
                }
              ],
              "Default": "ApprovalRequired"
            },
            "ApprovalRequired": {
              "Type": "Succeed",
              "Comment": "Alert only. Operator must start a new explicitly approved execution."
            },
            "Contain": {
              "Type": "Task",
              "Resource": {
                "Fn::GetAtt": [
                  "ResponderFunction",
                  "Arn"
                ]
              },
              "ResultPath": "$.response",
              "TimeoutSeconds": 45,
              "Retry": [
                {
                  "ErrorEquals": [
                    "States.TaskFailed",
                    "States.Timeout"
                  ],
                  "IntervalSeconds": 5,
                  "MaxAttempts": 2,
                  "BackoffRate": 2
                }
              ],
              "Next": "Verify"
            },
            "Verify": {
              "Type": "Choice",
              "Choices": [
                {
                  "Variable": "$.response.status",
                  "StringEquals": "verified",
                  "Next": "Verified"
                }
              ],
              "Default": "Unverified"
            },
            "Verified": {
              "Type": "Succeed"
            },
            "Unverified": {
              "Type": "Fail",
              "Error": "ContainmentNotVerified"
            }
          }
        }
      }
    },
    "FindingRouteRole": {
      "Type": "AWS::IAM::Role",
      "Properties": {
        "AssumeRolePolicyDocument": {
          "Version": "2012-10-17",
          "Statement": [
            {
              "Effect": "Allow",
              "Principal": {
                "Service": "events.amazonaws.com"
              },
              "Action": "sts:AssumeRole"
            }
          ]
        },
        "Policies": [
          {
            "PolicyName": "StartPolicyGate",
            "PolicyDocument": {
              "Version": "2012-10-17",
              "Statement": [
                {
                  "Effect": "Allow",
                  "Action": [
                    "states:StartExecution"
                  ],
                  "Resource": {
                    "Ref": "ResponseWorkflow"
                  }
                }
              ]
            }
          }
        ]
      }
    },
    "FindingRoute": {
      "Type": "AWS::Events::Rule",
      "Properties": {
        "EventBusName": {
          "Ref": "FindingsBus"
        },
        "EventPattern": {
          "source": [
            "sealed.iber"
          ],
          "detail-type": [
            "EvidenceFinding"
          ]
        },
        "State": "ENABLED",
        "Targets": [
          {
            "Id": "ResponsePolicy",
            "Arn": {
              "Ref": "ResponseWorkflow"
            },
            "RoleArn": {
              "Fn::GetAtt": [
                "FindingRouteRole",
                "Arn"
              ]
            },
            "InputPath": "$.detail",
            "RetryPolicy": {
              "MaximumEventAgeInSeconds": 3600,
              "MaximumRetryAttempts": 5
            },
            "DeadLetterConfig": {
              "Arn": {
                "Fn::GetAtt": [
                  "AuditFailureQueue",
                  "Arn"
                ]
              }
            }
          }
        ]
      }
    },
    "RouteDLQPolicy": {
      "Type": "AWS::SQS::QueuePolicy",
      "Properties": {
        "Queues": [
          {
            "Ref": "AuditFailureQueue"
          }
        ],
        "PolicyDocument": {
          "Version": "2012-10-17",
          "Statement": [
            {
              "Effect": "Allow",
              "Principal": {
                "Service": "events.amazonaws.com"
              },
              "Action": "sqs:SendMessage",
              "Resource": {
                "Fn::GetAtt": [
                  "AuditFailureQueue",
                  "Arn"
                ]
              },
              "Condition": {
                "ArnEquals": {
                  "aws:SourceArn": {
                    "Fn::GetAtt": [
                      "FindingRoute",
                      "Arn"
                    ]
                  }
                }
              }
            }
          ]
        }
      }
    },
    "HealthRole": {
      "Type": "AWS::IAM::Role",
      "Properties": {
        "AssumeRolePolicyDocument": {
          "Version": "2012-10-17",
          "Statement": [
            {
              "Effect": "Allow",
              "Principal": {
                "Service": "lambda.amazonaws.com"
              },
              "Action": "sts:AssumeRole"
            }
          ]
        }
      }
    },
    "HealthFunction": {
      "Type": "AWS::Serverless::Function",
      "Properties": {
        "CodeUri": "../src",
        "Handler": "sealed_telemetry.cloud_health.monitor",
        "Role": {
          "Fn::GetAtt": [
            "HealthRole",
            "Arn"
          ]
        },
        "Timeout": 40,
        "Environment": {
          "Variables": {
            "INTAKE_URL": {
              "Fn::Sub": "https://${IntakeApi}.execute-api.${AWS::Region}.${AWS::URLSuffix}/lab/evidence"
            },
            "OUTBOX_TABLE": {
              "Ref": "ProviderOutbox"
            },
            "DLQ_URL": {
              "Ref": "DLQ"
            },
            "AUDIT_FAILURE_URL": {
              "Ref": "AuditFailureQueue"
            },
            "QUEUE_NAME": {
              "Fn::GetAtt": [
                "EvidenceQueue",
                "QueueName"
              ]
            },
            "MONITORED_FUNCTIONS": {
              "Fn::Sub": [
                "{\"app\":[\"${A}\"],\"gateway\":[\"${G}\"],\"provider\":[\"${S}\",\"${F}\"],\"collector\":[\"${C}\",\"${N}\"]}",
                {
                  "A": {
                    "Ref": "AppFunction"
                  },
                  "G": {
                    "Ref": "GatewayFunction"
                  },
                  "S": {
                    "Ref": "SaasFunction"
                  },
                  "F": {
                    "Ref": "AuditForwarderFunction"
                  },
                  "C": {
                    "Ref": "CollectorFunction"
                  },
                  "N": {
                    "Ref": "NormalizerFunction"
                  }
                }
              ]
            }
          }
        },
        "Events": {
          "Heartbeat": {
            "Type": "Schedule",
            "Properties": {
              "Schedule": "rate(1 minute)",
              "Enabled": true
            }
          }
        }
      }
    },
    "HealthLogs": {
      "Type": "AWS::Logs::LogGroup",
      "Properties": {
        "LogGroupName": {
          "Fn::Sub": "/aws/lambda/${HealthFunction}"
        },
        "RetentionInDays": 14
      }
    },
    "HealthPolicy": {
      "Type": "AWS::IAM::Policy",
      "Properties": {
        "PolicyName": "ReadOperationalHealth",
        "Roles": [
          {
            "Ref": "HealthRole"
          }
        ],
        "PolicyDocument": {
          "Version": "2012-10-17",
          "Statement": [
            {
              "Effect": "Allow",
              "Action": [
                "lambda:GetFunctionConfiguration"
              ],
              "Resource": [
                {
                  "Fn::GetAtt": [
                    "AppFunction",
                    "Arn"
                  ]
                },
                {
                  "Fn::GetAtt": [
                    "GatewayFunction",
                    "Arn"
                  ]
                },
                {
                  "Fn::GetAtt": [
                    "SaasFunction",
                    "Arn"
                  ]
                },
                {
                  "Fn::GetAtt": [
                    "AuditForwarderFunction",
                    "Arn"
                  ]
                },
                {
                  "Fn::GetAtt": [
                    "CollectorFunction",
                    "Arn"
                  ]
                },
                {
                  "Fn::GetAtt": [
                    "NormalizerFunction",
                    "Arn"
                  ]
                }
              ]
            },
            {
              "Effect": "Allow",
              "Action": [
                "sqs:GetQueueAttributes"
              ],
              "Resource": [
                {
                  "Fn::GetAtt": [
                    "DLQ",
                    "Arn"
                  ]
                },
                {
                  "Fn::GetAtt": [
                    "AuditFailureQueue",
                    "Arn"
                  ]
                }
              ]
            },
            {
              "Effect": "Allow",
              "Action": [
                "cloudwatch:GetMetricStatistics"
              ],
              "Resource": "*"
            },
            {
              "Effect": "Allow",
              "Action": [
                "dynamodb:Query"
              ],
              "Resource": {
                "Fn::Sub": "${ProviderOutbox.Arn}/index/PendingIndex"
              }
            },
            {
              "Effect": "Allow",
              "Action": [
                "execute-api:Invoke"
              ],
              "Resource": {
                "Fn::Sub": "arn:${AWS::Partition}:execute-api:${AWS::Region}:${AWS::AccountId}:${IntakeApi}/lab/POST/evidence"
              }
            }
          ]
        }
      }
    },
    "HealthErrorAlarm": {
      "Type": "AWS::CloudWatch::Alarm",
      "Properties": {
        "Namespace": "AWS/Lambda",
        "MetricName": "Errors",
        "Dimensions": [
          {
            "Name": "FunctionName",
            "Value": {
              "Ref": "HealthFunction"
            }
          }
        ],
        "Statistic": "Sum",
        "Period": 60,
        "EvaluationPeriods": 1,
        "Threshold": 0,
        "ComparisonOperator": "GreaterThanThreshold",
        "TreatMissingData": "notBreaching",
        "AlarmActions": [
          {
            "Ref": "AlarmTopic"
          }
        ]
      }
    },
    "ActiveCredentials": {
      "Type": "AWS::DynamoDB::Table",
      "Properties": {
        "BillingMode": "PAY_PER_REQUEST",
        "SSESpecification": {
          "SSEEnabled": true
        },
        "AttributeDefinitions": [
          {
            "AttributeName": "credential_fingerprint",
            "AttributeType": "S"
          }
        ],
        "KeySchema": [
